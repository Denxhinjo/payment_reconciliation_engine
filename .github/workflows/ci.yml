name: ci

on:
  push:
  pull_request:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: recon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: worker
    env:
      RECON_TEST_ADMIN_URL: postgresql://postgres:recon_test@localhost:5432/postgres
      # Determinism subprocesses must actually run under their requested locale and time zone;
      # in CI a setting that is not in effect fails the test instead of skipping it (D-071).
      RECON_TEST_REQUIRE_ENVIRONMENTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.3.6" "lxml==6.1.3" "pytest==9.1.1"
      # The web end-to-end tests (tests/test_web_*.py) run the production build of web/.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, typecheck and build the web app
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run typecheck && npm run build
      - name: Provide the German locale used by the determinism tests
        run: sudo locale-gen de_DE.UTF-8 && locale -a | grep -i de_DE
      - run: python -m pytest -rs
